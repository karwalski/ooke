name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Drift gate (story 134.7): ooke builds against toke HEAD, and toke moves
  # without ooke moving. A daily run catches an upstream break the day it
  # happens rather than at the next ooke commit.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libssl-dev libsqlite3-dev clang

      # ── Build tkc (the toke compiler) ────────────────────────────────────
      - name: Clone and build tkc
        run: |
          git clone https://github.com/karwalski/toke.git ../toke
          cd ../toke
          echo "toke HEAD: $(git rev-parse --short HEAD) $(git log -1 --format=%cs) VERSION=$(cat VERSION)"
          make CFLAGS="-std=c99 -D_GNU_SOURCE -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Wno-misleading-indentation -DTKC_STDLIB_DIR='\"./src/stdlib\"'"

      # ── Version floor gate (story 134.7) ─────────────────────────────────
      # Fails the build if the toke checkout is below the floor declared in
      # ooke.toml [requires], or if ooke's own version strings disagree.
      - name: Check version floor
        run: |
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke"
          make check-versions \
               TOKE_ROOT="${TOKE_ROOT}" \
               TOKE_STDLIB="${TOKE_ROOT}/src/stdlib"

      # ── Build ooke ───────────────────────────────────────────────────────
      - name: Build ooke
        run: |
          TKC_PATH="${GITHUB_WORKSPACE}/../toke/toke"
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke"

          make TKC="${TKC_PATH}" \
               TOKE_ROOT="${TOKE_ROOT}" \
               TOKE_STDLIB="${TOKE_ROOT}/src/stdlib" \
               TOKE_VENDOR="${TOKE_ROOT}/stdlib/vendor" \
               CFLAGS="-std=c99 -D_GNU_SOURCE -O2 \
                       -iquote ${TOKE_ROOT}/src/stdlib \
                       -I${TOKE_ROOT}/stdlib/vendor/cmark/src \
                       -I${TOKE_ROOT}/stdlib/vendor/tomlc99 \
                       -Wno-pedantic -DTK_HAVE_OPENSSL"

      # ── Tests ────────────────────────────────────────────────────────────
      - name: Syntax check test files
        run: |
          TKC_PATH="${GITHUB_WORKSPACE}/../toke/toke"
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke"

          make test-check \
               TKC="${TKC_PATH}" \
               TOKE_ROOT="${TOKE_ROOT}" \
               TOKE_STDLIB="${TOKE_ROOT}/src/stdlib" \
               TOKE_VENDOR="${TOKE_ROOT}/stdlib/vendor" || echo "test-check completed with warnings"

      - name: Verify binary runs
        run: |
          ./ooke-toke --help || ./ooke-toke version || echo "Binary executes"
          ls -la ooke-toke
