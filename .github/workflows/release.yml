name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Build matrix: compile ooke on every target platform and package release
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - target: macos-arm64
            runner: macos-14
            os: macos
            arch: arm64
          - target: macos-x86_64
            runner: macos-13
            os: macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      # ── Install system dependencies ──────────────────────────────────────
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libssl-dev libsqlite3-dev clang

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install openssl@3 sqlite

      # ── Build tkc (the toke compiler) ────────────────────────────────────
      # Story 134.10: a release must pin the toke it was built with.  This
      # cloned toke `main` unpinned, so a tag rebuilt days apart produced
      # different binaries from the same ooke commit — and with toke's VERSION
      # frozen at 2.8.0 (story 134.15) nothing in the artefact recorded which.
      # The pin is ooke.toml [requires] mintokecommit, the one source of truth.
      - name: Clone and build tkc at ooke's declared floor
        run: |
          PIN=$(sed -n 's/^mintokecommit *= *"\(.*\)"/\1/p' ooke.toml)
          test -n "${PIN}" || { echo "ooke.toml [requires] has no mintokecommit"; exit 1; }
          echo "ooke.toml pins toke to ${PIN}"
          git clone https://github.com/karwalski/toke.git ../toke
          cd ../toke
          git checkout "${PIN}"
          # Story 134.41: plain `make`, exactly as ci.yml's build job (134.36).
          # The CFLAGS override this replaced baked TKC_STDLIB_DIR="./src/stdlib"
          # into tkc -- relative to wherever tkc runs, i.e. ooke's src/ -- so the
          # ooke build died on `E3011 identifier 'row' is not declared` in
          # src/store.tk, and a tagged release could not have built at all.
          # toke's Makefile bakes an absolute stdlib path.
          make
          ./toke --version
          echo "toke pinned: $(git rev-parse HEAD) $(git log -1 --format=%cs) VERSION=$(cat VERSION)"
          shasum -a 256 toke || sha256sum toke

      # ── Version floor gate (story 134.7) ─────────────────────────────────
      - name: Check version floor
        run: |
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke"
          make check-versions \
               TOKE_ROOT="${TOKE_ROOT}" \
               TOKE_STDLIB="${TOKE_ROOT}/src/stdlib"

      # ── Generate handlers and build ooke ─────────────────────────────────
      - name: Build ooke release binary
        run: |
          TKC_PATH="${GITHUB_WORKSPACE}/../toke/toke"
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke"

          EXTRA_CFLAGS=""
          EXTRA_LDFLAGS=""
          if [ "${{ matrix.os }}" = "macos" ]; then
            BREW_SSL="$(brew --prefix openssl@3)"
            BREW_SQL="$(brew --prefix sqlite)"
            EXTRA_CFLAGS="-I/opt/homebrew/include -I${BREW_SSL}/include -I${BREW_SQL}/include"
            EXTRA_LDFLAGS="-L/opt/homebrew/lib -L${BREW_SSL}/lib -L${BREW_SQL}/lib"
          fi

          make TKC="${TKC_PATH}" \
               TOKE_ROOT="${TOKE_ROOT}" \
               TOKE_STDLIB="${TOKE_ROOT}/src/stdlib" \
               TOKE_VENDOR="${TOKE_ROOT}/stdlib/vendor" \
               CFLAGS="-std=c99 -D_GNU_SOURCE -O2 -DNDEBUG \
                       -iquote ${TOKE_ROOT}/src/stdlib \
                       -I${TOKE_ROOT}/stdlib/vendor/cmark/src \
                       -I${TOKE_ROOT}/stdlib/vendor/tomlc99 \
                       -Wno-pedantic -DTK_HAVE_OPENSSL ${EXTRA_CFLAGS}" \
               LDFLAGS="${EXTRA_LDFLAGS}"
          echo "ooke-toke built successfully"
          ls -la ooke-toke

      # Story 134.10: docs/versioning.md claimed the release workflow ran the
      # checks before packaging.  It ran the version gate only.  The suite had
      # never run anywhere until 134.5, and could not fail until 134.17; a
      # release that does not run it is packaging the old silence again.
      - name: Run ooke's test suite
        run: |
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke"
          make test-run TOKE_ROOT="${TOKE_ROOT}" TKC="${TOKE_ROOT}/toke"

      # ── Package release tarball ──────────────────────────────────────────
      - name: Package release tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGING="ooke-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "${STAGING}"

          # Story 134.46: the installation tree -- binary (ooke-toke -> ooke),
          # Makefile, the two scripts `ooke compile` runs, src/ and the
          # compiled modules. The binary alone could not compile.
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke" sh scripts/stage_install.sh "${STAGING}"

          # Story 134.10: this used to ship ooke's OWN site -- templates/,
          # content/, pages/, static/ and an ooke.toml reading name = "my-site"
          # -- which a consumer neither needs nor should inherit.  The binary
          # is self-contained and `ooke new` scaffolds from code, not from
          # files copied out of this repo.  Ship the binary and the documents
          # you need to use and pin it.
          cp VERSION LICENSE README.md CHANGELOG.md "${STAGING}/"
          cp docs/install.md docs/versioning.md docs/public-api.md \
             docs/release-notes-3.0.0.md "${STAGING}/"

          # The pin, recorded in the artefact rather than only in the log.
          {
            echo "ooke        ${VERSION} ($(git rev-parse HEAD))"
            echo "platform    ${{ matrix.os }}-${{ matrix.arch }}"
            echo "toke        $(git -C ../toke rev-parse HEAD) ($(git -C ../toke log -1 --format=%cs))"
            echo "toke VERSION $(cat ../toke/VERSION)"
            sed -n '/^\[requires\]/,$p' ooke.toml | grep -E '^mintoke'
          } > "${STAGING}/MANIFEST.txt"
          cat "${STAGING}/MANIFEST.txt"

          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ooke-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Release: runs once after all builds succeed
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Compute checksums
        working-directory: release-artifacts
        run: sha256sum ooke-*.tar.gz > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ooke-*.tar.gz
            release-artifacts/checksums.txt
          body: |
            ## ooke ${{ github.ref_name }}

            ### Platform binaries

            | File | Platform |
            |------|----------|
            | `ooke-${{ github.ref_name }}-linux-x86_64.tar.gz` | Linux x86-64 |
            | `ooke-${{ github.ref_name }}-linux-arm64.tar.gz` | Linux ARM64 |
            | `ooke-${{ github.ref_name }}-macos-arm64.tar.gz` | macOS ARM64 (Apple Silicon) |
            | `ooke-${{ github.ref_name }}-macos-x86_64.tar.gz` | macOS x86-64 (Intel) |
            | `checksums.txt` | SHA-256 checksums for all tarballs |

            ### Install

            ```sh
            tar xzf ooke-${{ github.ref_name }}-linux-x86_64.tar.gz
            cd ooke-${{ github.ref_name }}-linux-x86_64
            ./ooke serve
            ```

            ### Each tarball contains

            - `ooke` -- the ooke binary, self-contained
            - `MANIFEST.txt` -- the ooke commit and the **toke commit** it was built at
            - `install.md` -- how to build toke at the pinned commit and ooke against it
            - `versioning.md` -- the evidence for the toke floor, build and behaviour
            - `public-api.md` -- what is stable and what is internal
            - `release-notes-3.0.0.md` -- **known open defects, including a P0**
            - `CHANGELOG.md`, `README.md`, `VERSION`, `LICENSE`

            ### Before you adopt this

            toke has no released version that works: pin the **commit** named in
            `MANIFEST.txt`. And read `release-notes-3.0.0.md` -- `ooke build`
            currently aborts on any project containing an API route, which is
            every project `ooke new` creates (story 134.24).
