name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Build matrix: compile ooke on every target platform and package release
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - target: macos-arm64
            runner: macos-14
            os: macos
            arch: arm64
          - target: macos-x86_64
            runner: macos-13
            os: macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      # ── Install system dependencies ──────────────────────────────────────
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libssl-dev libsqlite3-dev clang

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install openssl@3 sqlite

      # ── Build tkc (the toke compiler) ────────────────────────────────────
      - name: Clone and build tkc
        run: |
          git clone https://github.com/karwalski/toke.git ../toke
          cd ../toke
          make CFLAGS="-std=c99 -D_GNU_SOURCE -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Wno-misleading-indentation -DTKC_STDLIB_DIR='\"./src/stdlib\"'"
          echo "TKC built successfully: $(./toke --version 2>&1 || echo 'ok')"

      # ── Generate handlers and build ooke ─────────────────────────────────
      - name: Build ooke release binary
        run: |
          TKC_PATH="${GITHUB_WORKSPACE}/../toke/toke"
          TOKE_ROOT="${GITHUB_WORKSPACE}/../toke"

          EXTRA_CFLAGS=""
          EXTRA_LDFLAGS=""
          if [ "${{ matrix.os }}" = "macos" ]; then
            BREW_SSL="$(brew --prefix openssl@3)"
            BREW_SQL="$(brew --prefix sqlite)"
            EXTRA_CFLAGS="-I/opt/homebrew/include -I${BREW_SSL}/include -I${BREW_SQL}/include"
            EXTRA_LDFLAGS="-L/opt/homebrew/lib -L${BREW_SSL}/lib -L${BREW_SQL}/lib"
          fi

          make TKC="${TKC_PATH}" \
               TOKE_ROOT="${TOKE_ROOT}" \
               TOKE_STDLIB="${TOKE_ROOT}/src/stdlib" \
               TOKE_VENDOR="${TOKE_ROOT}/stdlib/vendor" \
               CFLAGS="-std=c99 -D_GNU_SOURCE -O2 -DNDEBUG \
                       -iquote ${TOKE_ROOT}/src/stdlib \
                       -I${TOKE_ROOT}/stdlib/vendor/cmark/src \
                       -I${TOKE_ROOT}/stdlib/vendor/tomlc99 \
                       -Wno-pedantic -DTK_HAVE_OPENSSL ${EXTRA_CFLAGS}" \
               LDFLAGS="${EXTRA_LDFLAGS}"
          echo "ooke-toke built successfully"
          ls -la ooke-toke

      # ── Package release tarball ──────────────────────────────────────────
      - name: Package release tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGING="ooke-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "${STAGING}"

          # Binary (rename ooke-toke -> ooke)
          cp ooke-toke "${STAGING}/ooke"
          chmod +x "${STAGING}/ooke"

          # Runtime content/template directories
          cp -r templates "${STAGING}/templates" 2>/dev/null || true
          cp -r content "${STAGING}/content" 2>/dev/null || true
          cp -r pages "${STAGING}/pages" 2>/dev/null || true
          cp -r static "${STAGING}/static" 2>/dev/null || true

          # Config
          cp ooke.toml "${STAGING}/" 2>/dev/null || true

          # LICENSE
          cp LICENSE "${STAGING}/"

          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ooke-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Release: runs once after all builds succeed
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Compute checksums
        working-directory: release-artifacts
        run: sha256sum ooke-*.tar.gz > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ooke-*.tar.gz
            release-artifacts/checksums.txt
          body: |
            ## ooke ${{ github.ref_name }}

            ### Platform binaries

            | File | Platform |
            |------|----------|
            | `ooke-${{ github.ref_name }}-linux-x86_64.tar.gz` | Linux x86-64 |
            | `ooke-${{ github.ref_name }}-linux-arm64.tar.gz` | Linux ARM64 |
            | `ooke-${{ github.ref_name }}-macos-arm64.tar.gz` | macOS ARM64 (Apple Silicon) |
            | `ooke-${{ github.ref_name }}-macos-x86_64.tar.gz` | macOS x86-64 (Intel) |
            | `checksums.txt` | SHA-256 checksums for all tarballs |

            ### Install

            ```sh
            tar xzf ooke-${{ github.ref_name }}-linux-x86_64.tar.gz
            cd ooke-${{ github.ref_name }}-linux-x86_64
            ./ooke serve
            ```

            ### Each tarball contains

            - `ooke` -- the ooke web framework binary
            - `templates/` -- HTML template files
            - `content/` -- content pages
            - `pages/` -- page handler sources
            - `static/` -- static assets (CSS, JS, images)
            - `ooke.toml` -- default configuration
            - `LICENSE`
