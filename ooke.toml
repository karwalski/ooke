[site]
name = "my-site"
url = "https://example.com"
language = "en"

[build]
output = "build/"
minify = true
inlinecss = true

[server]
port = 3000
workers = 0
# corsorigins = "http://localhost:11432"

[log]
accessformat = "combined"

[paths]
apiprefix = ""

[requires]
# The minimum toke ooke actually works on.  FIVE floors were measured, and
# this block carries the HIGHEST, because it is the one a user feels.
#
#   compile floor     b66bd8e  2026-07-06  (134.7)   — ooke BUILDS
#   behaviour floor   c2aa278  2026-09-19  (134.16)  — ooke's suite PASSES
#   installable floor 6cc9061  2026-09-19  (127.85)  — a CLONE of toke builds
#   cache floor       cee7cc0  2026-09-27  (127.226) — the template cache stores
#   host floor        668caa6  2026-09-28  (138.1)   — [server] host compiles:
#                                                      ooke calls http.serveworkerson
#   release floor     3.1.0    2026-09-30  (138.17)  — the first toke RELEASE that
#                     216965f                          contained every floor above
#   realpath floor    db47d591 2026-10-01  (121.59)  — template names resolve with
#                                                      file.realpath (121.60), and
#                                                      os.write links os_glue.c
#                                                      (121.70); NOT in any release
#
# The seventh (story 121.59 (3), 2026-10-01): ooke confines partial/layout
# reads to templates/ with toke's file.realpath, and links os_glue.c, where
# toke 121.70 moved os.write's wrapper.  Both arrived in toke merge db47d591,
# which is on toke main and in NO released toke: toke 3.1.0 lacks both, so
# `mintoke = "3.1.0"` is again necessary but not sufficient and the
# commit/date pair is the floor.  When toke releases a version containing
# db47d591, set mintoke to it.
#
# The sixth (toke story 138.17, 2026-09-30): toke 3.1.0 is the first toke
# version that contains 668caa6, so mintoke = "3.1.0" is now sufficient on its
# own: every toke labelled 3.1.0 or later has the host-binding serve functions
# and the 127.226 cache fix, and ooke's full `make test` passes on it (toke
# release/3.1.0).  The commit/date pair now names the commit that set toke's
# VERSION to 3.1.0 (216965f); it is kept only because CI clones toke at
# mintokecommit, and can be dropped once the v3.1.0 tag is published.
#
# The fourth (story 138.7, 2026-09-28): toke has since cut 3.0.0 (tag v3.0.0
# = 0b0bc4e, 2026-09-23), but ooke's suite FAILS on it, 11 of 12:
# test_template's "a render through the populated cache serves the stored
# tokens" (127.226).  toke 3.0.0 lowers `.set` on a map-typed struct field as
# an array `.set`, so ooke's template cache never stores anything.  toke's fix
# is Batch DA, merged as cee7cc0; the full suite passes there (measured from a
# fresh worktree, 2026-09-28).  So `mintoke = "3.0.0"` is necessary but not
# sufficient, and the commit/date pair stays until toke releases a version
# that contains the declared commit (story 138.17); then mintoke alone is the
# floor.
#
# The fifth (story 138.7, O-3): `[server] host` binds through toke's
# http.serveworkerson / http.servetlson (toke story 138.1, merged as
# 668caa6).  No earlier toke has them, so ooke does not compile before it.
# The suite passes on 18b9f73, which differs from 668caa6 only in
# docs/progress.md and docs/metrics-baseline.md.
#
# The third was found by story 134.10 doing what it said and verifying the
# package from fresh clones rather than the working tree: a clone of toke at
# c2aa278 has no stdlib/vendor at all, because toke's 127.85 — which tracks
# the vendored cmark and tomlc99 — is LATER than c2aa278.  Pinning the
# behaviour floor pinned a commit nobody can clone and build; the build dies
# in clang with an opaque E9003 naming neither the dependency nor the cure.
# Same defect class as ooke's own 134.21, and the same lesson: a floor that
# has only ever been tested in a tree that already had the files is untested.
#
# Story 134.16 built tkc at the 134.7 compile floor and ran ooke's (now honest,
# 187-assertion) suite against it: 10 of 12.  A compiler that compiles ooke is
# not a compiler that runs it.  The binding defect is toke's, fixed by c2aa278
# "consume @tk_current_error for toml.bool and toml.i64, so false and 0 are
# values": before it, `minify = false` and `inlinecss = false` in THIS FILE are
# read back as `true`, so a site configured not to minify silently minifies.
# Declaring the lower floor was declaring support ooke did not have.
#
# The semver alone is NOT sufficient — toke/VERSION has read 2.8.0 since
# 2026-06-21 while the v0.4 syntax break (Epic 116), the ADR-0010 capability
# model (Epic 124) and this fix all shipped under that same string — so the
# enforceable floor is the commit/date pair.  When toke cuts the v0.4 version
# (story 134.15), mintoke becomes sufficient on its own and the commit/date
# pair can be dropped.  Makefile: check-toke-version reads these three keys;
# they are the single source of truth.  Evidence: docs/versioning.md.
mintoke = "3.1.0"
mintokedate = "2026-10-01"
mintokecommit = "db47d591"
